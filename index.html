<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaCal | calorie counter</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-Arial min-h-screen flex flex-col justify-between">
    <header class="bg-[#87CEEB] text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">VitaCal</h1>
            <span class="text-sm bg-[#87CEEB] px-3 py-1 rounded-full font-medium">Daily Tracker</span>
        </div>
    </header>
<main class="container mx-auto px-4 py-6 md:py-8 max-w-4xl flex-grow grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="md:col-span-1 space-y-6">
        <div class="bg-white p-5 sm:p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Add Foodstuff</h2>
            <form id="food-form" class="space-y-4">
                    <div>
                        <label for="food-name" class="block text-xs font-semibold text-gray-500 uppercase mb-1">Food Name</label>
                        <input type="text" id="food-name" required placeholder="e.g., BLT sandwich" 
                            class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-[#87CEEB] text-sm">
                    </div>
                    <div>
                        <label for="calorie-amount" class="block text-xs font-semibold text-gray-500 uppercase mb-1">Calories (kcal)</label>
                        <input type="number" id="calorie-amount" required min="1" placeholder="e.g., 1200" 
                            class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500 text-sm">
                    </div>
                    <button type="submit" 
                        class="w-full bg-[#87CEEB] text-white font-medium py-2.5 rounded-lg transition duration-200 text-sm cursor-pointer active:scale-98 form-btn">
                        Add to notes
                     </button>
            </form>
        </div>
        
    </div>

</main>    
    
</body>
</html>
